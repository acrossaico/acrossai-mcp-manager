name: ESLint

on:
  push:
    branches: [main]
  pull_request:
    # NOTE: intentionally NO `paths:` filter.
    #
    # Branch protection requires this check name (`JavaScript Lint`). When a
    # workflow is path-filtered AND branch-protection-required, GitHub reports
    # "Expected — Waiting for status to be reported" indefinitely on PRs that
    # don't touch the filtered paths — blocking every unrelated PR (F022 hit
    # this exact trap 2026-07-13).
    #
    # The syntax-only smoke test costs ~30s per PR. Trivial. See B27 memory
    # entry for the general pattern. Post-F040: `src/js/ai-connectors.js`
    # moved to the acrossai-ai-connectors companion plugin, so this workflow
    # smoke-tests `src/js/backend.js` instead (a small, stable file that
    # exercises the same parse-error surface).

permissions: {}

concurrency:
  group: eslint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eslint:
    name: JavaScript Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '18'
          cache: 'npm'

      # `--legacy-peer-deps` is required — @wordpress/dataviews@17 pins
      # @wordpress/components@^36 whose peer resolution collides under npm 10+
      # strict mode even though the lockfile pins react@18.3.1 (satisfies ^18).
      - run: npm ci --no-audit --no-fund --legacy-peer-deps

      # `wp-scripts lint-js` currently bundles eslint 10 while its internal
      # config still uses the legacy eslintrc format — the two are
      # incompatible (`Legacy eslintrc configuration detected. ESLint v10 no
      # longer supports eslintrc files`). The plugin also ships no eslint
      # config of its own. Until we migrate to eslint's flat config, invoke
      # eslint 8 directly with `--no-eslintrc` so this workflow performs a
      # syntax-only smoke test of `src/js/` — enough to catch parse errors +
      # obvious mistakes without pulling in wp-scripts's stale ruleset.
      # Follow-up: add `eslint.config.js` (flat config) + re-wire to
      # `wp-scripts lint-js` once wp-scripts's internal config is migrated.
      - name: Install top-level eslint 8 (bypass wp-scripts legacy-config)
        run: npm install eslint@^8 --no-save --legacy-peer-deps

      # Scope: `src/js/backend.js` (small, stable, no React). Pre-F040 this
      # smoke test targeted `src/js/ai-connectors.js` which moved to the
      # acrossai-ai-connectors companion plugin. The larger React entries
      # (abilities.js / access-control.js / tools.js / embeds.js) carry
      # inline `// eslint-disable-next-line react-hooks/exhaustive-deps`
      # style comments referencing rules from plugins we don't load in this
      # smoke test, which trip "Definition for rule ... was not found".
      # Expanding scope to the whole `src/js/` tree needs a proper flat
      # config + the relevant plugin loads — captured in the follow-up list.
      # `--no-inline-config` is defense-in-depth for the same class of issue.
      - name: Run ESLint (syntax-only smoke test)
        run: |
          ./node_modules/.bin/eslint \
            --no-eslintrc \
            --no-inline-config \
            --parser-options=ecmaVersion:latest,sourceType:module \
            src/js/backend.js

      # The committed bundle must match the committed source.
      #
      # `build/` is tracked in this repository, so a change to `src/js/` that
      # is not rebuilt ships as a non-feature: the source says one thing and
      # the file the browser loads says another. That happened — a commit
      # changed `src/js/activity-log/` and the bundle it was serving stayed
      # eighteen hours behind, so the feature was never live and nothing
      # failed to say so.
      #
      # `build-zip.yml` already runs `npm run build`, but only on `main` and
      # only to package a zip; it never compares the result against what is
      # committed. This does, and on pull requests, where it can still be
      # fixed by the person who caused it.
      #
      # Reuses the Node setup above rather than adding a job, so the cost is a
      # webpack run on a checkout that is already prepared.
      #
      # Catches CODE changes, not comment-only ones — webpack strips comments,
      # so editing only a comment in `src/js/` leaves the bundle byte-identical
      # and this stays green. Verified both ways rather than assumed.
      - name: Verify the committed bundle matches the source
        run: |
          npm run build
          if ! git diff --exit-code --stat -- build/; then
            echo "::error::build/ is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi
