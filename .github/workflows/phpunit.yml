name: PHPUnit

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '**.php'
      - 'composer.json'
      - 'composer.lock'
      - 'phpunit.xml.dist'
      - 'tests/**'
      - 'bin/install-wp-tests.sh'
      - '.github/workflows/phpunit.yml'

permissions: {}

concurrency:
  group: phpunit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pure service classes — no WordPress bootstrap required.
  phpunit-pure:
    name: PHPUnit (pure) — PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Dev-only toolchain floor; does NOT affect runtime PHP 8.1+ support
        # (verified by phpcompat.yml). phpunit/phpunit is pinned to ^12 rather
        # than ^13 because yoast/phpunit-polyfills — which the WordPress test
        # suite hard-requires — supports ^7.5 || ^8 || ^9 || ^11 || ^12 and has
        # no PHPUnit 13 release. ^12 is also a stable tag, so the dev-stability
        # flag the old ^13.2@dev constraint needed is gone.
        php: ['8.4']

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit — mcpclients suite (pure, no WP)
        run: vendor/bin/phpunit --testsuite mcpclients

      # F080 rename gate — also pure (no WP bootstrap). It existed in
      # phpunit.xml.dist but was never wired into CI, so the canary that is
      # supposed to catch a "quick-setup" identifier creeping back has never
      # actually guarded a pull request.
      - name: Run PHPUnit — rename-gate suite (pure, no WP)
        run: vendor/bin/phpunit --testsuite rename-gate

      # Every *Test.php must live under a directory some testsuite references.
      # Four directories holding 7 test files had silently fallen outside all
      # suites, so they never ran. Cheap structural check; no WP needed.
      - name: Assert no test file is outside a configured testsuite
        run: |
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          covered = {
              os.path.normpath(d.text.strip())
              for ts in ET.parse('phpunit.xml.dist').getroot().iter('testsuite')
              for d in ts.findall('directory')
          }
          missing = [d for d in covered if not os.path.isdir(d)]
          orphans = []
          for root, _, files in os.walk('tests/phpunit'):
              if not any(f.endswith('Test.php') for f in files):
                  continue
              n = os.path.normpath(root)
              if not any(n == c or n.startswith(c + os.sep) for c in covered):
                  orphans.append(n)
          for d in sorted(missing):
              print(f"::error::testsuite references a missing directory: {d}")
          for d in sorted(orphans):
              print(f"::error::test files outside every testsuite: {d}")
          sys.exit(1 if (missing or orphans) else 0)
          PY

  # WordPress integration tests — require the WP test lib + a MySQL service.
  # Covers the F021 oauth suite (SC-008 cleanup, TokenValidator audience, DCR,
  # authorize state policy, refresh-token family revocation, etc.).
  phpunit-integration:
    name: PHPUnit (integration) — PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # This job is a real gate again. It previously ran WordPress 4.7.35 (a
    # greedy regex in bin/install-wp-tests.sh picked the LAST offer from the
    # version-check payload instead of the first), which cannot be installed
    # by PHP 8.4 — so the test tables were never created and every suite
    # below fataled on startup. Two `sed` neutralization steps and a
    # step-level `continue-on-error: true` on all ten suites turned that into
    # a passing check. Both the hacks and the flags are gone; the resolution
    # bug is fixed at source with a hard version floor that fails the job
    # loudly rather than silently installing an ancient core.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # See pure-job matrix note on the PHPUnit 12 pin.
        php: ['8.4']
        wp: ['latest']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
          extensions: mysqli, mbstring, curl, dom, xml

      - name: Install SVN + subversion tooling (WP test lib needs it)
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - run: composer install --prefer-dist --no-progress

      - name: Install WordPress test scaffolding
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 "$WP_VERSION" true

      # WP-dependent suites — override the default pure bootstrap in
      # phpunit.xml.dist to load the WordPress test scaffolding + plugin.
      #
      # These steps deliberately carry NO `continue-on-error`. They used to,
      # as belt-and-braces around the __autoload / phpunit6-compat hacks that
      # a WordPress 4.7.35 install forced on us. That combination meant every
      # one of these ten suites fataled on startup and the job still reported
      # success to branch protection — zero tests executed, green check, for
      # months. Root cause was a greedy regex in bin/install-wp-tests.sh
      # resolving "latest" to the LAST offer in the version-check payload;
      # fixed there, with a hard version floor so it cannot regress silently.
      #
      # If a suite fails here now, it is a real failure. Fix the test or the
      # code — do not reintroduce continue-on-error.
      - name: Run PHPUnit — admin suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite admin

      - name: Run PHPUnit — cli-rest suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite cli-rest

      - name: Run PHPUnit — renderers suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite renderers

      - name: Run PHPUnit — abilities suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite abilities

      - name: Run PHPUnit — database suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite database

      - name: Run PHPUnit — mcp suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite mcp

      - name: Run PHPUnit — F035 discovery suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite discovery

      - name: Run PHPUnit — F037 embeds suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite embeds

      - name: Run PHPUnit — F038 user-servers suite
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite user-servers

      - name: Run PHPUnit — remaining suite (REST / utilities / uninstall)
        run: vendor/bin/phpunit --bootstrap tests/bootstrap-wp.php --testsuite remaining
